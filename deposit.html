<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#020408"/>
<title>NEXA10 — Deposit Funds</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --neon-blue:#00d4ff;
  --neon-purple:#8b5cf6;
  --neon-green:#00ff88;
  --neon-red:#ff4466;
  --neon-amber:#ffaa00;
  --dark-bg:#020408;
  --dark-card:#080d18;
  --dark-card2:#0a1020;
  --border-dim:rgba(0,212,255,0.12);
  --border-glow:rgba(0,212,255,0.2);
  --text-primary:#f0f4ff;
  --text-muted:#8899bb;
  --text-dim:#4a5878;
  --grad-main:linear-gradient(135deg,#00d4ff 0%,#8b5cf6 50%,#ec4899 100%);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  font-family:'Rajdhani',sans-serif;
  background:var(--dark-bg);
  color:var(--text-primary);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#020408;}
::-webkit-scrollbar-thumb{background:var(--neon-blue);border-radius:2px;}

#particles{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;}
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px);
  background-size:50px 50px;
  mask-image:linear-gradient(180deg,#000 0%,transparent 95%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 95%);
}

/* ── TOP BAR ── */
.page-top{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:14px;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  background:rgba(2,4,8,0.9);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-dim);
}
.back-btn{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(8,13,24,0.8);
  border:1px solid var(--border-dim);
  color:var(--text-muted);
  text-decoration:none;
  transition:.25s;
  flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.back-btn:hover,.back-btn:focus-visible{
  color:var(--neon-blue);
  border-color:var(--border-glow);
  box-shadow:0 0 16px rgba(0,212,255,0.12);
}
.back-btn svg{width:22px;height:22px;}
.page-title-wrap{display:flex;align-items:center;gap:12px;min-width:0;}
.page-title-icon{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,rgba(0,212,255,0.2),rgba(139,92,246,0.15));
  border:1px solid var(--border-glow);
  display:flex;align-items:center;justify-content:center;
  color:var(--neon-blue);
  flex-shrink:0;
  box-shadow:0 0 20px rgba(0,212,255,0.15);
}
.page-title-icon svg{width:22px;height:22px;}
.page-title{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.05rem,4vw,1.25rem);
  font-weight:700;
  letter-spacing:1px;
  white-space:nowrap;
}

/* ── MAIN ── */
.deposit-main{
  position:relative;z-index:1;
  max-width:720px;
  margin:0 auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}

.deposit-panel{
  background:var(--dark-card);
  border:1px solid var(--border-dim);
  border-radius:16px;
  padding:clamp(20px,4vw,28px);
  box-shadow:0 12px 40px rgba(0,0,0,0.4),0 0 1px rgba(0,212,255,0.15);
}

.panel-head{
  display:flex;align-items:flex-start;gap:14px;
  margin-bottom:24px;
  padding-bottom:20px;
  border-bottom:1px solid rgba(0,212,255,0.08);
}
.panel-head-icon{
  width:48px;height:48px;border-radius:12px;
  background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(139,92,246,0.12));
  border:1px solid var(--border-dim);
  display:flex;align-items:center;justify-content:center;
  color:var(--neon-blue);
  flex-shrink:0;
}
.panel-head-icon svg{width:26px;height:26px;}
.panel-head-text h2{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.1rem,3.5vw,1.35rem);
  font-weight:700;
  margin-bottom:6px;
  line-height:1.2;
}
.panel-head-text p{
  font-size:clamp(0.9rem,2.6vw,1rem);
  color:var(--text-muted);
  line-height:1.5;
}

.methods-label{
  font-size:0.72rem;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:14px;
}

.methods-list{
  display:flex;
  flex-direction:column;
  gap:12px;
  list-style:none;
}

.pay-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  width:100%;
  padding:18px 18px;
  border-radius:12px;
  border:1px solid transparent;
  text-decoration:none;
  cursor:pointer;
  transition:border-color .25s,box-shadow .25s,transform .2s;
  -webkit-tap-highlight-color:transparent;
  text-align:left;
  font-family:inherit;
  background:transparent;
}
.pay-card:hover,.pay-card:focus-visible{
  transform:translateY(-2px);
}
.pay-card.selected{
  box-shadow:0 0 0 2px rgba(0,212,255,0.35);
}

.pay-card.easypaisa{
  background:linear-gradient(135deg,rgba(0,255,136,0.08),rgba(0,212,255,0.04));
  border-color:rgba(0,255,136,0.25);
}
.pay-card.easypaisa:hover,.pay-card.easypaisa.selected{
  border-color:rgba(0,255,136,0.5);
  box-shadow:0 8px 28px rgba(0,255,136,0.12);
}
.pay-card.easypaisa .pay-sub{color:var(--neon-green);}

.pay-card.jazzcash{
  background:linear-gradient(135deg,rgba(255,68,102,0.1),rgba(236,72,153,0.05));
  border-color:rgba(255,68,102,0.28);
}
.pay-card.jazzcash:hover,.pay-card.jazzcash.selected{
  border-color:rgba(255,68,102,0.5);
  box-shadow:0 8px 28px rgba(255,68,102,0.12);
}
.pay-card.jazzcash .pay-sub{color:#ff6b8a;}

.pay-card.bank{
  background:linear-gradient(135deg,rgba(0,212,255,0.08),rgba(0,102,255,0.05));
  border-color:rgba(0,212,255,0.28);
}
.pay-card.bank:hover,.pay-card.bank.selected{
  border-color:rgba(0,212,255,0.55);
  box-shadow:0 8px 28px rgba(0,212,255,0.15);
}
.pay-card.bank .pay-sub{color:var(--neon-blue);}

.pay-info{flex:1;min-width:0;}
.pay-name{
  display:block;
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1rem,3vw,1.12rem);
  font-weight:700;
  color:var(--text-primary);
  margin-bottom:4px;
}
.pay-sub{
  display:block;
  font-size:clamp(0.88rem,2.5vw,0.95rem);
  font-weight:600;
}

.pay-icon-wrap{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  border:1px solid rgba(255,255,255,0.12);
}
.pay-card.easypaisa .pay-icon-wrap{
  background:rgba(0,255,136,0.15);
  color:var(--neon-green);
}
.pay-card.jazzcash .pay-icon-wrap{
  background:rgba(255,68,102,0.15);
  color:#ff6b8a;
}
.pay-card.bank .pay-icon-wrap{
  background:rgba(0,212,255,0.15);
  color:var(--neon-blue);
}
.pay-icon-wrap svg{width:28px;height:28px;}

.continue-wrap{
  margin-top:22px;
  display:none;
}
.continue-wrap.visible{display:block;}
.btn-continue{
  width:100%;
  padding:16px;
  border:none;border-radius:12px;
  font-family:'Orbitron',sans-serif;
  font-size:0.85rem;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:#fff;
  background:var(--grad-main);
  cursor:pointer;
  transition:.3s;
  min-height:52px;
}
.btn-continue:hover{
  box-shadow:0 8px 32px rgba(139,92,246,0.45);
  transform:translateY(-1px);
}

@media(max-width:400px){
  .pay-card{padding:16px 14px;}
  .pay-icon-wrap{width:46px;height:46px;}
  .pay-icon-wrap svg{width:24px;height:24px;}
}
</style>
</head>
<body>

<canvas id="particles" aria-hidden="true"></canvas>
<div class="bg-grid" aria-hidden="true"></div>

<header class="page-top">
  <a href="dashboard.html" class="back-btn" aria-label="Back to dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>
  <div class="page-title-wrap">
    <span class="page-title-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="14" rx="2"/>
        <path d="M2 10h20"/>
        <path d="M6 14h4"/>
      </svg>
    </span>
    <h1 class="page-title">Deposit Funds</h1>
  </div>
</header>

<main class="deposit-main">
  <div class="deposit-panel">
    <div class="panel-head">
      <div class="panel-head-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M9 9h6v6H9z"/>
          <path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>
        </svg>
      </div>
      <div class="panel-head-text">
        <h2>Select Payment Method</h2>
        <p>Add funds to your account</p>
      </div>
    </div>

    <p class="methods-label" id="methodsLabel">Payment Methods</p>
    <ul class="methods-list" role="listbox" aria-labelledby="methodsLabel">
      <li>
        <button type="button" class="pay-card easypaisa" role="option" data-method="easypaisa" aria-selected="false">
          <span class="pay-info">
            <span class="pay-name">EasyPaisa</span>
            <span class="pay-sub">Deposit: USD</span>
          </span>
          <span class="pay-icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="9" r="5"/>
              <circle cx="15" cy="15" r="5"/>
            </svg>
          </span>
        </button>
      </li>
      <li>
        <button type="button" class="pay-card jazzcash" role="option" data-method="jazzcash" aria-selected="false">
          <span class="pay-info">
            <span class="pay-name">JazzCash</span>
            <span class="pay-sub">Deposit: USD</span>
          </span>
          <span class="pay-icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="9" r="5"/>
              <circle cx="15" cy="15" r="5"/>
            </svg>
          </span>
        </button>
      </li>
      <li>
        <button type="button" class="pay-card bank" role="option" data-method="bank" aria-selected="false">
          <span class="pay-info">
            <span class="pay-name">Bank Transfer</span>
            <span class="pay-sub">Direct Bank Deposit</span>
          </span>
          <span class="pay-icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18"/>
              <path d="M5 21V7l7-4 7 4v14"/>
              <path d="M9 21v-6h6v6"/>
              <path d="M9 10h6"/>
            </svg>
          </span>
        </button>
      </li>
    </ul>

    <div class="continue-wrap" id="continueWrap">
      <button type="button" class="btn-continue" id="continueBtn">Continue →</button>
    </div>
  </div>
</main>

<script>
(function(){
  const cards=document.querySelectorAll('.pay-card');
  const wrap=document.getElementById('continueWrap');
  const btn=document.getElementById('continueBtn');
  let selected=null;

  cards.forEach(card=>{
    card.addEventListener('click',()=>{
      cards.forEach(c=>{
        c.classList.remove('selected');
        c.setAttribute('aria-selected','false');
      });
      card.classList.add('selected');
      card.setAttribute('aria-selected','true');
      selected=card.dataset.method;
      wrap.classList.add('visible');
    });
  });

  btn.addEventListener('click',()=>{
    if(!selected)return;
    alert('Payment details for '+selected.replace(/^\w/,c=>c.toUpperCase())+' will open here. Connect your backend or add a payment form page.');
  });

  const canvas=document.getElementById('particles');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  let W,H,pts=[];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize);
  for(let i=0;i<50;i++){
    pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.2+.3,a:Math.random()*.35+.08});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;
      if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(0,212,255,'+p.a+')';ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
