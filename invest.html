<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#020408"/>
<title>NEXA10 — GPU Plans</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --neon-blue:#00d4ff;
  --neon-purple:#8b5cf6;
  --neon-green:#00ff88;
  --neon-amber:#ffaa00;
  --dark-bg:#020408;
  --dark-card:#080d18;
  --dark-card2:#0a1020;
  --border-dim:rgba(0,212,255,0.12);
  --border-glow:rgba(0,212,255,0.2);
  --text-primary:#f0f4ff;
  --text-muted:#8899bb;
  --text-dim:#4a5878;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  font-family:'Rajdhani',sans-serif;
  background:var(--dark-bg);
  color:var(--text-primary);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#020408;}
::-webkit-scrollbar-thumb{background:var(--neon-blue);border-radius:2px;}

#particles{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;}
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px);
  background-size:50px 50px;
  mask-image:linear-gradient(180deg,#000 0%,transparent 95%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 95%);
}

.page-top{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:12px;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  background:rgba(2,4,8,0.9);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-dim);
}
.back-btn{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(8,13,24,0.8);
  border:1px solid var(--border-dim);
  color:var(--text-muted);
  text-decoration:none;
  transition:.25s;
  flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.back-btn:hover,.back-btn:focus-visible{
  color:var(--neon-blue);
  border-color:var(--border-glow);
  box-shadow:0 0 16px rgba(0,212,255,0.12);
}
.back-btn svg{width:22px;height:22px;}
.page-title-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.page-title-icon{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,rgba(0,212,255,0.2),rgba(139,92,246,0.12));
  border:1px solid var(--border-glow);
  display:flex;align-items:center;justify-content:center;
  color:var(--neon-blue);
  flex-shrink:0;
  box-shadow:0 0 20px rgba(0,212,255,0.12);
}
.page-title-icon svg{width:22px;height:22px;}
.page-title{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.05rem,4vw,1.25rem);
  font-weight:700;
  letter-spacing:1px;
  white-space:nowrap;
}
.calc-btn{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border-dim);
  background:rgba(8,13,24,0.8);
  color:var(--text-muted);
  font-family:'Rajdhani',sans-serif;
  font-size:0.88rem;
  font-weight:600;
  cursor:pointer;
  transition:.25s;
  flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.calc-btn svg{width:18px;height:18px;}
.calc-btn:hover,.calc-btn:focus-visible{
  color:var(--neon-blue);
  border-color:var(--border-glow);
}

.invest-main{
  position:relative;z-index:1;
  max-width:720px;
  margin:0 auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}

/* ── PLAN CARD ── */
.plan-card{
  background:var(--dark-card);
  border:1px solid var(--border-dim);
  border-radius:16px;
  padding:clamp(20px,4vw,26px);
  box-shadow:0 12px 40px rgba(0,0,0,0.4),0 0 1px rgba(0,212,255,0.12);
}

.plan-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
}
.plan-name-block h2{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.5rem,5vw,1.85rem);
  font-weight:900;
  letter-spacing:2px;
  line-height:1.1;
}
.plan-name-block p{
  margin-top:6px;
  font-size:clamp(0.88rem,2.5vw,0.95rem);
  color:var(--text-muted);
}

.badge-active{
  padding:6px 14px;
  border-radius:20px;
  font-size:0.75rem;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  background:rgba(0,255,136,0.12);
  border:1px solid rgba(0,255,136,0.4);
  color:var(--neon-green);
  flex-shrink:0;
  box-shadow:0 0 16px rgba(0,255,136,0.15);
}

.stats-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:12px;
}
.stat-box{
  background:var(--dark-card2);
  border:1px solid var(--border-dim);
  border-radius:12px;
  padding:16px;
}
.stat-box-head{
  display:flex;align-items:center;gap:8px;
  margin-bottom:10px;
}
.stat-box-icon{
  width:28px;height:28px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.stat-box-icon svg{width:16px;height:16px;}
.stat-box--profit .stat-box-icon{
  background:rgba(0,212,255,0.1);
  color:var(--neon-blue);
}
.stat-box--duration .stat-box-icon{
  background:rgba(139,92,246,0.12);
  color:var(--neon-purple);
}
.stat-label{
  font-size:0.82rem;
  color:var(--text-muted);
  font-weight:600;
}
.stat-value{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.1rem,3.5vw,1.25rem);
  font-weight:700;
}
.stat-box--profit .stat-value{color:var(--neon-green);}
.stat-box--duration .stat-value{color:var(--text-primary);}

.range-box{
  background:var(--dark-card2);
  border:1px solid var(--border-dim);
  border-radius:12px;
  padding:16px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
}
.range-left{
  display:flex;
  align-items:flex-start;
  gap:12px;
  flex:1;
  min-width:0;
}
.range-icon{
  width:36px;height:36px;
  border-radius:10px;
  background:rgba(0,212,255,0.1);
  border:1px solid rgba(0,212,255,0.25);
  display:flex;align-items:center;justify-content:center;
  color:var(--neon-blue);
  flex-shrink:0;
}
.range-icon svg{width:18px;height:18px;}
.range-label{
  font-size:0.82rem;
  color:var(--text-muted);
  font-weight:600;
  margin-bottom:6px;
}
.range-value{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(0.95rem,3vw,1.1rem);
  font-weight:700;
  word-break:break-word;
}

.badge-hourly{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 12px;
  border-radius:20px;
  background:rgba(0,212,255,0.08);
  border:1px solid rgba(0,212,255,0.25);
  color:var(--neon-blue);
  font-size:0.78rem;
  font-weight:700;
  letter-spacing:0.5px;
  flex-shrink:0;
}
.badge-hourly svg{width:14px;height:14px;}

.btn-invest{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:16px 24px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#00d4ff,#0099cc);
  color:#020408;
  font-family:'Orbitron',sans-serif;
  font-size:clamp(0.95rem,3vw,1.05rem);
  font-weight:700;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 0 32px rgba(0,212,255,0.45),0 8px 24px rgba(0,0,0,0.3);
  transition:transform .2s,box-shadow .25s;
  min-height:52px;
  -webkit-tap-highlight-color:transparent;
}
.btn-invest svg{width:20px;height:20px;}
.btn-invest:hover{
  transform:translateY(-2px);
  box-shadow:0 0 40px rgba(0,212,255,0.55),0 12px 28px rgba(0,0,0,0.35);
}
.btn-invest:active{transform:translateY(0);}

/* ── CALCULATOR MODAL ── */
.calc-overlay{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:rgba(2,4,8,0.82);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;
  transition:opacity .25s,visibility .25s;
}
.calc-overlay.open{opacity:1;visibility:visible;}

.calc-modal{
  width:100%;max-width:440px;
  max-height:min(92vh,720px);
  overflow-y:auto;
  background:var(--dark-card);
  border:1px solid var(--border-glow);
  border-radius:18px;
  box-shadow:0 24px 60px rgba(0,0,0,0.55),0 0 40px rgba(0,212,255,0.12);
  transform:translateY(16px) scale(0.98);
  transition:transform .25s;
}
.calc-overlay.open .calc-modal{transform:translateY(0) scale(1);}

.calc-modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 16px;
  border-bottom:1px solid rgba(0,212,255,0.08);
}
.calc-modal-title{
  display:flex;align-items:center;gap:10px;
  font-family:'Orbitron',sans-serif;
  font-size:clamp(0.95rem,3.5vw,1.05rem);
  font-weight:700;
  letter-spacing:0.5px;
}
.calc-modal-title svg{width:22px;height:22px;color:var(--neon-blue);}
.calc-close{
  width:40px;height:40px;border-radius:10px;
  border:1px solid var(--border-dim);
  background:rgba(8,13,24,0.8);
  color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.25s;
  -webkit-tap-highlight-color:transparent;
}
.calc-close svg{width:20px;height:20px;}
.calc-close:hover,.calc-close:focus-visible{
  color:var(--neon-blue);
  border-color:var(--border-glow);
}

.calc-modal-body{padding:18px 20px 20px;}

.plan-pill{
  display:flex;align-items:center;justify-content:center;
  padding:10px 16px;
  margin-bottom:18px;
  border-radius:10px;
  background:var(--dark-card2);
  border:1px solid var(--border-dim);
  font-size:0.92rem;
  font-weight:600;
  color:var(--text-muted);
}
.plan-pill strong{color:var(--text-primary);font-family:'Orbitron',sans-serif;}

.calc-field{margin-bottom:18px;}
.calc-field label{
  display:block;
  font-size:0.68rem;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:8px;
}
.amount-wrap{
  display:flex;align-items:center;
  background:var(--dark-card2);
  border:1px solid var(--border-glow);
  border-radius:12px;
  box-shadow:0 0 20px rgba(0,212,255,0.1);
  overflow:hidden;
  transition:box-shadow .25s;
}
.amount-wrap:focus-within{
  box-shadow:0 0 28px rgba(0,212,255,0.22);
  border-color:rgba(0,212,255,0.45);
}
.amount-prefix{
  padding:14px 0 14px 16px;
  font-family:'Orbitron',sans-serif;
  font-size:1.15rem;
  font-weight:700;
  color:var(--neon-blue);
}
.amount-wrap input{
  flex:1;min-width:0;
  padding:14px 16px 14px 8px;
  border:none;background:transparent;
  color:var(--text-primary);
  font-family:'Orbitron',sans-serif;
  font-size:1.15rem;
  font-weight:700;
}
.amount-wrap input:focus{outline:none;}
.amount-wrap input::-webkit-outer-spin-button,
.amount-wrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.amount-wrap input[type=number]{-moz-appearance:textfield;appearance:textfield;}

.returns-label{
  font-size:0.68rem;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:10px;
}
.returns-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}
.return-card{
  position:relative;
  background:var(--dark-card2);
  border:1px solid var(--border-dim);
  border-radius:12px;
  padding:14px;
  overflow:hidden;
}
.return-card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
  opacity:.85;
}
.return-card--hourly::before{background:var(--neon-blue);}
.return-card--daily::before{background:var(--neon-green);}
.return-card--weekly::before{background:var(--neon-purple);}
.return-card--monthly::before{background:var(--neon-amber);}

.return-card-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.return-card-label{
  font-size:0.68rem;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.return-card--hourly .return-card-label{color:var(--neon-blue);}
.return-card--daily .return-card-label{color:var(--neon-green);}
.return-card--weekly .return-card-label{color:var(--neon-purple);}
.return-card--monthly .return-card-label{color:var(--neon-amber);}

.return-card-icon{
  width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  opacity:.7;
}
.return-card-icon svg{width:16px;height:16px;}
.return-card--hourly .return-card-icon{color:var(--neon-blue);}
.return-card--daily .return-card-icon{color:var(--neon-green);}
.return-card--weekly .return-card-icon{color:var(--neon-purple);}
.return-card--monthly .return-card-icon{color:var(--neon-amber);}

.return-card-value{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1rem,3.5vw,1.15rem);
  font-weight:700;
  color:var(--text-primary);
  font-variant-numeric:tabular-nums;
}

.total-return-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 18px;
  margin-bottom:18px;
  border-radius:12px;
  background:rgba(0,255,136,0.05);
  border:1px solid rgba(0,255,136,0.2);
}
.total-return-left .total-label{
  font-size:0.68rem;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin-bottom:4px;
}
.total-return-left .total-sub{
  font-size:0.82rem;
  color:var(--text-muted);
}
.total-return-value{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.35rem,4.5vw,1.6rem);
  font-weight:700;
  color:var(--neon-green);
  text-shadow:0 0 20px rgba(0,255,136,0.35);
  font-variant-numeric:tabular-nums;
  flex-shrink:0;
}

.btn-calc-close{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border-dim);
  background:var(--dark-card2);
  color:var(--text-muted);
  font-family:'Rajdhani',sans-serif;
  font-size:0.95rem;
  font-weight:700;
  letter-spacing:1px;
  cursor:pointer;
  transition:.25s;
  min-height:48px;
  -webkit-tap-highlight-color:transparent;
}
.btn-calc-close:hover{
  color:var(--text-primary);
  border-color:var(--border-glow);
}
</style>
</head>
<body>

<canvas id="particles" aria-hidden="true"></canvas>
<div class="bg-grid" aria-hidden="true"></div>

<header class="page-top">
  <a href="dashboard.html" class="back-btn" aria-label="Back to dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>
  <div class="page-title-wrap">
    <span class="page-title-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
        <rect x="9" y="9" width="6" height="6"/>
        <path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/>
      </svg>
    </span>
    <h1 class="page-title">GPU Plans</h1>
  </div>
  <button type="button" class="calc-btn" id="calcToggle" aria-haspopup="dialog" aria-controls="calcModal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="2" width="16" height="20" rx="2"/>
      <path d="M8 6h8M8 10h8M8 14h4M8 18h4"/>
    </svg>
    Calculator
  </button>
</header>

<main class="invest-main">
  <article class="plan-card" aria-label="GPT investment plan">
    <div class="plan-top">
      <div class="plan-name-block">
        <h2>GPT</h2>
        <p>A plan to start a future</p>
      </div>
      <span class="badge-active">Active</span>
    </div>

    <div class="stats-row">
      <div class="stat-box stat-box--profit">
        <div class="stat-box-head">
          <span class="stat-box-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 17l6-6 4 4 8-8"/>
              <path d="M14 7h7v7"/>
            </svg>
          </span>
          <span class="stat-label">Profit</span>
        </div>
        <div class="stat-value" id="planProfit">0.18%</div>
      </div>
      <div class="stat-box stat-box--duration">
        <div class="stat-box-head">
          <span class="stat-box-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
          </span>
          <span class="stat-label">Duration</span>
        </div>
        <div class="stat-value">2160 hours</div>
      </div>
    </div>

    <div class="range-box">
      <div class="range-left">
        <span class="range-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </span>
        <div>
          <div class="range-label">Investment Range</div>
          <div class="range-value">$1 – $10,000,000</div>
        </div>
      </div>
      <span class="badge-hourly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        Hourly
      </span>
    </div>

    <button type="button" class="btn-invest" id="investNowBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
        <rect x="9" y="9" width="6" height="6"/>
        <path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/>
      </svg>
      Invest Now
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
  </article>
</main>

<div class="calc-overlay" id="calcOverlay" role="dialog" aria-modal="true" aria-labelledby="calcModalTitle" hidden>
  <div class="calc-modal" id="calcModal">
    <div class="calc-modal-head">
      <div class="calc-modal-title" id="calcModalTitle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 17l6-6 4 4 8-8"/>
          <path d="M14 7h7v7"/>
        </svg>
        Profit Calculator
      </div>
      <button type="button" class="calc-close" id="calcClose" aria-label="Close calculator">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="calc-modal-body">
      <div class="plan-pill"><strong>GPT</strong>&nbsp;·&nbsp;0.18% hourly</div>
      <div class="calc-field">
        <label for="calcAmount">Investment Amount</label>
        <div class="amount-wrap">
          <span class="amount-prefix">$</span>
          <input type="number" id="calcAmount" min="1" max="10000000" value="1" step="any" inputmode="decimal"/>
        </div>
      </div>
      <div class="returns-label">Estimated Returns</div>
      <div class="returns-grid">
        <div class="return-card return-card--hourly">
          <div class="return-card-head">
            <span class="return-card-label">Hourly</span>
            <span class="return-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </span>
          </div>
          <div class="return-card-value" id="valHourly">$0.0018</div>
        </div>
        <div class="return-card return-card--daily">
          <div class="return-card-head">
            <span class="return-card-label">Daily</span>
            <span class="return-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </span>
          </div>
          <div class="return-card-value" id="valDaily">$0.04</div>
        </div>
        <div class="return-card return-card--weekly">
          <div class="return-card-head">
            <span class="return-card-label">Weekly</span>
            <span class="return-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </span>
          </div>
          <div class="return-card-value" id="valWeekly">$0.30</div>
        </div>
        <div class="return-card return-card--monthly">
          <div class="return-card-head">
            <span class="return-card-label">Monthly</span>
            <span class="return-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </span>
          </div>
          <div class="return-card-value" id="valMonthly">$1.30</div>
        </div>
      </div>
      <div class="total-return-box">
        <div class="total-return-left">
          <div class="total-label">Total Return</div>
          <div class="total-sub">Over 2160 hours</div>
        </div>
        <div class="total-return-value" id="valTotal">$3.89</div>
      </div>
      <button type="button" class="btn-calc-close" id="calcCloseBtn">Close</button>
    </div>
  </div>
</div>

<script>
(function(){
  const HOURLY_RATE=0.0018;
  const PLAN_HOURS=2160;
  const MIN_AMOUNT=1;
  const MAX_AMOUNT=10000000;

  const calcToggle=document.getElementById('calcToggle');
  const calcOverlay=document.getElementById('calcOverlay');
  const calcClose=document.getElementById('calcClose');
  const calcCloseBtn=document.getElementById('calcCloseBtn');
  const calcAmount=document.getElementById('calcAmount');
  const valHourly=document.getElementById('valHourly');
  const valDaily=document.getElementById('valDaily');
  const valWeekly=document.getElementById('valWeekly');
  const valMonthly=document.getElementById('valMonthly');
  const valTotal=document.getElementById('valTotal');

  function formatMoney(n){
    if(n===0) return '$0.00';
    const abs=Math.abs(n);
    if(abs<0.01) return '$'+n.toFixed(4);
    if(abs<1) return '$'+n.toFixed(3);
    return '$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  }

  function clampAmount(raw){
    let n=parseFloat(raw);
    if(isNaN(n)||n<0) n=0;
    if(n>MAX_AMOUNT) n=MAX_AMOUNT;
    return n;
  }

  function updateCalc(){
    const amount=clampAmount(calcAmount.value);
    const hourly=amount*HOURLY_RATE;
    const daily=hourly*24;
    const weekly=daily*7;
    const monthly=daily*30;
    const total=hourly*PLAN_HOURS;
    valHourly.textContent=formatMoney(hourly);
    valDaily.textContent=formatMoney(daily);
    valWeekly.textContent=formatMoney(weekly);
    valMonthly.textContent=formatMoney(monthly);
    valTotal.textContent=formatMoney(total);
  }

  function openCalc(){
    calcOverlay.hidden=false;
    calcOverlay.classList.add('open');
    document.body.style.overflow='hidden';
    calcAmount.focus();
    calcAmount.select();
    updateCalc();
  }

  function closeCalc(){
    calcOverlay.classList.remove('open');
    calcOverlay.hidden=true;
    document.body.style.overflow='';
    calcToggle.focus();
  }

  calcToggle.addEventListener('click',openCalc);
  calcClose.addEventListener('click',closeCalc);
  calcCloseBtn.addEventListener('click',closeCalc);
  calcOverlay.addEventListener('click',e=>{if(e.target===calcOverlay) closeCalc();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&calcOverlay.classList.contains('open')) closeCalc();});

  calcAmount.addEventListener('input',updateCalc);
  calcAmount.addEventListener('change',()=>{
    let n=clampAmount(calcAmount.value);
    if(n>0&&n<MIN_AMOUNT) n=MIN_AMOUNT;
    calcAmount.value=n||'';
    updateCalc();
  });
  updateCalc();

  document.getElementById('investNowBtn').addEventListener('click',()=>{
    const amt=prompt('Enter investment amount ($1 – $10,000,000):','100');
    if(amt===null) return;
    const n=parseFloat(amt);
    if(isNaN(n)||n<MIN_AMOUNT||n>MAX_AMOUNT){
      alert('Please enter an amount between $1 and $10,000,000.');
      return;
    }
    alert('Investment request for $'+n.toLocaleString()+' on GPT plan submitted. Connect your backend to process this.');
  });

  const canvas=document.getElementById('particles');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  let W,H,pts=[];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize);
  for(let i=0;i<50;i++){
    pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.2+.3,a:Math.random()*.35+.08});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;
      if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(0,212,255,'+p.a+')';ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
