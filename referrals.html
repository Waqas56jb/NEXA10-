<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#020408"/>
<title>NEXA10 — Referrals</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --neon-blue:#00d4ff;
  --neon-purple:#8b5cf6;
  --neon-green:#00ff88;
  --dark-bg:#020408;
  --dark-card:#080d18;
  --dark-card2:#0a1020;
  --border-dim:rgba(0,212,255,0.12);
  --border-glow:rgba(0,212,255,0.2);
  --text-primary:#f0f4ff;
  --text-muted:#8899bb;
  --text-dim:#4a5878;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  font-family:'Rajdhani',sans-serif;
  background:var(--dark-bg);
  color:var(--text-primary);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#020408;}
::-webkit-scrollbar-thumb{background:var(--neon-blue);border-radius:2px;}

#particles{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;}
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px);
  background-size:50px 50px;
  mask-image:linear-gradient(180deg,#000 0%,transparent 95%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 95%);
}

.page-top{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:14px;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  background:rgba(2,4,8,0.9);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-dim);
}
.back-btn{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(8,13,24,0.8);
  border:1px solid var(--border-dim);
  color:var(--text-muted);
  text-decoration:none;
  transition:.25s;
  flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.back-btn:hover,.back-btn:focus-visible{
  color:var(--neon-blue);
  border-color:var(--border-glow);
  box-shadow:0 0 16px rgba(0,212,255,0.12);
}
.back-btn svg{width:22px;height:22px;}
.page-title-wrap{display:flex;align-items:center;gap:12px;min-width:0;}
.page-title-icon{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,rgba(139,92,246,0.2),rgba(0,212,255,0.12));
  border:1px solid var(--border-dim);
  display:flex;align-items:center;justify-content:center;
  color:var(--neon-blue);
  flex-shrink:0;
}
.page-title-icon svg{width:22px;height:22px;}
.page-title{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.05rem,4vw,1.25rem);
  font-weight:700;
  letter-spacing:1px;
  white-space:nowrap;
}

.ref-main{
  position:relative;z-index:1;
  max-width:820px;
  margin:0 auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}

.ref-panel{
  background:var(--dark-card);
  border:1px solid var(--border-dim);
  border-radius:16px;
  padding:clamp(20px,4vw,28px);
  box-shadow:0 12px 40px rgba(0,0,0,0.4);
}

.panel-head{
  display:flex;align-items:flex-start;gap:14px;
  margin-bottom:22px;
}
.panel-head-icon{
  width:48px;height:48px;border-radius:12px;
  background:linear-gradient(135deg,rgba(0,255,136,0.15),rgba(0,212,255,0.08));
  border:1px solid rgba(0,255,136,0.3);
  display:flex;align-items:center;justify-content:center;
  color:var(--neon-green);
  flex-shrink:0;
  box-shadow:0 0 20px rgba(0,255,136,0.12);
}
.panel-head-icon svg{width:26px;height:26px;}
.panel-head-text h2{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.1rem,3.5vw,1.35rem);
  font-weight:700;
  margin-bottom:6px;
  line-height:1.2;
}
.panel-head-text p{
  font-size:clamp(0.9rem,2.6vw,1rem);
  color:var(--text-muted);
}

/* 3 columns × 3 stat cards */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:clamp(10px,2.5vw,14px);
  align-items:stretch;
}
.stat-col{
  display:flex;
  flex-direction:column;
  gap:clamp(8px,2vw,12px);
  min-width:0;
}

.stat-card{
  flex:1;
  background:var(--dark-card2);
  border:1px solid var(--border-dim);
  border-radius:12px;
  padding:clamp(16px,3vw,22px) clamp(12px,2.5vw,16px);
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:88px;
  transition:border-color .25s,box-shadow .25s;
}
.stat-card:hover{
  border-color:rgba(0,212,255,0.22);
  box-shadow:0 4px 20px rgba(0,0,0,0.25);
}

.stat-value{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(1.35rem,4.5vw,1.75rem);
  font-weight:700;
  line-height:1.1;
  margin-bottom:8px;
  font-variant-numeric:tabular-nums;
}
.stat-label{
  font-size:clamp(0.78rem,2.2vw,0.88rem);
  color:var(--text-muted);
  font-weight:600;
  letter-spacing:0.3px;
}

.stat-col--total .stat-value{color:var(--neon-blue);}
.stat-col--total .stat-card{border-color:rgba(0,212,255,0.15);}
.stat-col--direct .stat-value{color:var(--neon-green);}
.stat-col--direct .stat-card{border-color:rgba(0,255,136,0.12);}
.stat-col--indirect .stat-value{color:var(--neon-purple);}
.stat-col--indirect .stat-card{border-color:rgba(139,92,246,0.15);}

.ref-link-banner{
  margin-top:22px;
  padding:16px 18px;
  border-radius:12px;
  background:rgba(0,212,255,0.04);
  border:1px solid var(--border-dim);
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.ref-link-banner p{
  font-size:0.9rem;
  color:var(--text-muted);
  flex:1;
  min-width:200px;
}
.ref-link-banner code{
  display:block;
  margin-top:6px;
  font-size:0.82rem;
  color:var(--neon-blue);
  word-break:break-all;
}
.btn-copy{
  padding:10px 18px;
  border-radius:10px;
  border:1px solid var(--border-glow);
  background:rgba(0,212,255,0.08);
  color:var(--neon-blue);
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:0.88rem;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
  transition:.25s;
  min-height:44px;
  -webkit-tap-highlight-color:transparent;
}
.btn-copy:hover{
  background:rgba(0,212,255,0.15);
  box-shadow:0 0 18px rgba(0,212,255,0.15);
}

@media(max-width:640px){
  .stats-grid{
    grid-template-columns:1fr;
    gap:20px;
  }
  .stat-col{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .stat-card{min-height:76px;padding:14px 10px;}
  .stat-value{font-size:1.2rem;margin-bottom:4px;}
  .stat-label{font-size:0.72rem;}
}
@media(max-width:400px){
  .stat-col{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<canvas id="particles" aria-hidden="true"></canvas>
<div class="bg-grid" aria-hidden="true"></div>

<header class="page-top">
  <a href="dashboard.html" class="back-btn" aria-label="Back to dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>
  <div class="page-title-wrap">
    <span class="page-title-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    </span>
    <h1 class="page-title">Referrals</h1>
  </div>
</header>

<main class="ref-main">
  <div class="ref-panel">
    <div class="panel-head">
      <div class="panel-head-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div class="panel-head-text">
        <h2>Referral Statistics</h2>
        <p>Your network performance</p>
      </div>
    </div>

    <div class="stats-grid" role="group" aria-label="Referral statistics">
      <div class="stat-col stat-col--total">
        <div class="stat-card">
          <span class="stat-value" id="totalCount">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="totalCom">$0</span>
          <span class="stat-label">Total Com.</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="totalInvest">$0</span>
          <span class="stat-label">Total Invest.</span>
        </div>
      </div>

      <div class="stat-col stat-col--direct">
        <div class="stat-card">
          <span class="stat-value" id="directCount">0</span>
          <span class="stat-label">Direct</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="directCom">$0</span>
          <span class="stat-label">Direct Com.</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="directInvest">$0</span>
          <span class="stat-label">Direct Invest.</span>
        </div>
      </div>

      <div class="stat-col stat-col--indirect">
        <div class="stat-card">
          <span class="stat-value" id="indirectCount">0</span>
          <span class="stat-label">Indirect</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="indirectCom">$0</span>
          <span class="stat-label">Indirect Com.</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="indirectInvest">$0</span>
          <span class="stat-label">Indirect Invest.</span>
        </div>
      </div>
    </div>

    <div class="ref-link-banner">
      <p>
        Share your link to grow your network
        <code id="refLinkText">https://nexa10.com/register?ref=81ibdsh3zc</code>
      </p>
      <button type="button" class="btn-copy" id="copyRefBtn">Copy Link</button>
    </div>
  </div>
</main>

<script>
(function(){
  const link='https://nexa10.com/register?ref=81ibdsh3zc';
  const copyBtn=document.getElementById('copyRefBtn');
  const linkEl=document.getElementById('refLinkText');
  if(linkEl) linkEl.textContent=link;

  copyBtn.addEventListener('click',async()=>{
    try{
      await navigator.clipboard.writeText(link);
      copyBtn.textContent='Copied!';
      setTimeout(()=>{copyBtn.textContent='Copy Link';},2000);
    }catch(e){
      const ta=document.createElement('textarea');
      ta.value=link;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyBtn.textContent='Copied!';
      setTimeout(()=>{copyBtn.textContent='Copy Link';},2000);
    }
  });

  const canvas=document.getElementById('particles');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  let W,H,pts=[];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize);
  for(let i=0;i<50;i++){
    pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.2+.3,a:Math.random()*.35+.08});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;
      if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(0,212,255,'+p.a+')';ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
